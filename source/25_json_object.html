<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /*
      # 8. JSON 객체 내장 함수
        -실습 : (25_json.html)

        1. JSON(Javascript Object Notation)
        - 데이터를 저장하거나 전송 시 많이 사용하는 데이터 교환 형식(데이터 포맷)
        - 클라이언트와 서버간의 데이터 전송 시 가장 많이 사용하는 포맷
        - Object 표기법과 동일(cf : 키에 “ ”가 있고, 선언자가 없다)
        - 프로그래밍 언어와 관계없이 사용할 수 있는 데이터 교환 형식
        - 대부분의 프로그래밍 언어에서 json을 처리할 수 있는 라이브러리를 제공
        */

      let student = {
        name: "공은성",
        tel: "101-3333-4444",
        address: "신림동",
      };
      console.log(student);

      let jStudent = JSON.stringify(student);
      console.log(jStudent);

      let oStudent = JSON.parse(jStudent);
      console.log(jStudent);

      let arr = [1, 2, 3, 4];
      let jArr = JSON.stringify(arr);
      console.log(jArr);
      let oArr = JSON.parse(jArr);
      console.log(oArr);

      
    </script>
  </body>
</html>
