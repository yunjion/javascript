<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Posts 데이터 관리</h1>
    <div>
      <input type="text" id="inputId" placeholder="ID" />
      <input type="text" id="inputTitle" placeholder="TITLE" />
      <input type="text" id="inputViews" placeholder="VIEWS" />
    </div>
    <div>
      <button id="btnRead" onclick="getData('posts')">조회</button>
      <button id="btnCreate()" onclick="putData()">추가</button>
      <button id="btnUpdate()" onclick="postData()">수정</button>
      <button id="btnDelete()" onclick="deleteData()">삭제</button>
    </div>
    <h2>데이터 목록</h2>
   <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>TITLE</th>
          <th>VIEWS</th>
        </tr>
      </thead>
  <tbody id="print"></tbody>
</table></div>
    <script>
      /*
      1.조회
      2.추가
      3.수정
      4.삭제
      5.rendering : text,u1,table.... => push,join
      6.추가함수 : 자유롭게 
      */
      //rendering함수
      const rendering = (dataList) => {
        const tbody = document.getElementById("print");
        const arr = [];

        dataList.forEach((item) => {
          arr.push(
            `<tr>
                <td>${item.id}</td>
                <td>${item.title}</td>
                <td>${item.views}</td>
              </tr>`,
          );
        });

        tbody.innerHTML = arr.join("");
      };
      //조회
      const getData = (data) => {
        const xhr = new XMLHttpRequest();

        xhr.open("GET", `http://localhost:3000/${data}`);
        xhr.setRequestHeader("content-type", "application/json");
        xhr.send();

        xhr.onload = () => {
          if (xhr.status === 200) {
           const result = JSON.parse(xhr.response);
           rendering(result);
          } else {
            console.log(xhr.status, xhr.statusText);
          }
        };
      };
      //수정
      const putData = () => {
        const xhr = new XMLHttpRequest();
        const id = document.getElementById("inputId").value;
        const title = document.getElementById("inputTitle").value;
        const views = document.getElementById("inputViews").value;

        xhr.open("PUT", `http://localhost:3000/posts/${id}`);
        xhr.setRequestHeader("content-type", "application/json:chareset=utf-8");
        const putData = [];
        xhr.send(JSON.stringify(putData));

        xhr.onload = () => {
          if (xhr.status === 200) {
            const result = JSON.parse(xhr.response)
          } else {
            console.log(xhr.status, xhr.statusText);
          }
        };
      };
      //삭제
       const deleteData = () => {
        const xhr = new XMLHttpRequest();
         const id = document.getElementById("inputId").value;
        xhr.open("DELETE", `http://localhost:3000/posts/${id}`);
        xhr.setRequestHeader("content-type", "application/json");

        xhr.send();

        xhr.onload = () => {
          if (xhr.status === 200) {
             getData("posts");
          } else {
            console.log(xhr.status, xhr.statusText);
          }
        };
      };
    </script>
  </body>
</html>
