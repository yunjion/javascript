        /* 개발자들의 왜 일반 객체대신 map을 쓸까?

      /* 실무 예제: 온라인 쇼핑몰 장바구니 관리

      const myCart = new Map();

      //이미 장바구니에 들어있는 제품 목록

      myCart.set("product_12",{name : "노트북", price :2100000, quantity :})
