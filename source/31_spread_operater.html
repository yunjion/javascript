<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      //...의 활용
      //1. concate
      let arr1 = [1, 2, 3];
      let arr2 = [4, 5, 6];
      let arr3 = [7, 8, 9];
      let arr6 = [...arr1, ...arr2, ...arr3];
      console.log(arr6);

      //2. 복사
      let target = ["a", "b", "c"];
      let result = [...target];
      console.log(target);
      console.log(result);

      console.log(target === result);

      //3. 형변환
      const wishList = new Set();
      wishList.add("d");
      wishList.add("e");
      wishList.add("f");
      console.log(wishList);
      console.log([...wishList]);

      //4. rest parameter
      function sumRM(...nums) {
        let sum = 0;
        for (const n of nums) {
          sum += 0;
        }
        return sum;
      }
    </script>
  </body>
</html>
