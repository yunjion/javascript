  <body>
    <button type="button" onclick="srp('가위')">가위</button>
    <button type="button" onclick="srp('바위')">바위</button>
    <button type="button" onclick="srp('보')">보</button>

    <script src="./js/common.js"></script>
    <script>
      const choices = ["가위", "바위", "보"];

      let user = prompt("가위, 바위, 보 중 하나를 입력하세요");

      if (user === choices) {
        console.log("무승부");
      } else if (user === "가위" && choices === "바위") {
        console.log("졌습니다");
      } else if (user === "가위" && choices === "보") {
        console.log("이겼습니다");
      } else if (user === "바위" && choices === "가위") {
        console.log("졌습니다");
      } else if (user === "바위" && choices === "보") {
        console.log("이겼습니다");
      } else if (user === "보" && choices === "가위") {
        console.log("졌습니다");
      } else {
        console.log("이겼습니다");
      }
    </script>
